  <circle cx="600" cy="240" r="140" fill="#dc2626" opacity="0.16" filter="url(#glowEffect5)"/>

  <rect x="60" y="45" width="680" height="360" rx="16" fill="#1c0f0a" fill-opacity="0.85" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <rect x="60" y="45" width="680" height="42" rx="16" fill="#2d170f" fill-opacity="0.9"/>
  <circle cx="90" cy="66" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="106" cy="66" r="5" fill="#eab308" opacity="0.8"/>
  <circle cx="122" cy="66" r="5" fill="#22c55e" opacity="0.8"/>
  <text x="150" y="71" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">AERO-FLARE // NASA-FIRMS // WILDFIRE-INTELLIGENCE</text>

  <rect x="570" y="56" width="150" height="20" rx="10" fill="#ea580c" fill-opacity="0.3" stroke="#f97316" stroke-width="1"/>
  <text x="645" y="70" fill="#fed7aa" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">LIVE VERCEL DEPLOYED</text>

