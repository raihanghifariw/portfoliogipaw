      <rect x="0" y="53" width="190" height="8" rx="4" fill="#ea580c"/>

      <text x="0" y="80" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">+24 Hours Spread Radius: 18.5 km (High Risk)</text>
      <rect x="0" y="88" width="280" height="8" rx="4" fill="#331409"/>
      <rect x="0" y="88" width="260" height="8" rx="4" fill="#ef4444"/>

      <text x="0" y="125" fill="#fed7aa" font-family="'JetBrains Mono', monospace" font-size="10">VLM Summary: Severe wind shift eastward expected at 03:00</text>
