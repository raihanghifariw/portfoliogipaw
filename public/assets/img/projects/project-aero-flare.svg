  <g transform="translate(90, 115)">
    <text x="0" y="0" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">NASA FIRMS Satellite Thermal GIS</text>
    <text x="0" y="18" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Real-time VIIRS / MODIS Ingestion</text>

