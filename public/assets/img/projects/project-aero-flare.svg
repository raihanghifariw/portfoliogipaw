    <circle cx="150" cy="110" r="22" fill="#f97316" fill-opacity="0.45"/>
    <circle cx="150" cy="110" r="8" fill="#fef08a"/>

    <circle cx="90" cy="150" r="25" fill="#ef4444" fill-opacity="0.2"/>
    <circle cx="90" cy="150" r="6" fill="#f97316"/>

    <rect x="15" y="45" width="100" height="22" rx="4" fill="#0f172a" fill-opacity="0.9"/>
