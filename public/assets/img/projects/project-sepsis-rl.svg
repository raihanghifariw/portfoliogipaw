<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glowEffect2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad2)"/>
  
  <g opacity="0.12">
    <path d="M 0 60 L 800 60 M 0 120 L 800 120 M 0 180 L 800 180 M 0 240 L 800 240 M 0 300 L 800 300 M 0 360 L 800 360" stroke="#0ea5e9" stroke-width="1"/>
    <path d="M 80 0 L 80 450 M 160 0 L 160 450 M 240 0 L 240 450 M 320 0 L 320 450 M 400 0 L 400 450 M 480 0 L 480 450 M 560 0 L 560 450 M 640 0 L 640 450 M 720 0 L 720 450" stroke="#0ea5e9" stroke-width="1"/>
  </g>

  <circle cx="260" cy="200" r="150" fill="#0284c7" opacity="0.16" filter="url(#glowEffect2)"/>
  <circle cx="580" cy="260" r="130" fill="#6366f1" opacity="0.18" filter="url(#glowEffect2)"/>

  <rect x="60" y="45" width="680" height="360" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <rect x="60" y="45" width="680" height="42" rx="16" fill="#1e293b" fill-opacity="0.9"/>
  <circle cx="90" cy="66" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="106" cy="66" r="5" fill="#eab308" opacity="0.8"/>
  <circle cx="122" cy="66" r="5" fill="#22c55e" opacity="0.8"/>
  <text x="150" y="71" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">RL-ENSEMBLE // SOFT-ACTOR-CRITIC // SEPSIS-3</text>

  <rect x="580" y="56" width="140" height="20" rx="10" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1"/>
  <text x="650" y="70" fill="#7dd3fc" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">75.31% SURVIVAL RATE</text>

  <!-- Ensemble 5 SAC Agents -->
  <g transform="translate(90, 115)">
    <text x="0" y="0" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">5× SAC Ensemble Matrix</text>
    <text x="0" y="18" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Median Action Aggregation + Autoencoder</text>

    <g transform="translate(0, 35)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="65" y="18" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">SAC Agent #1</text>

      <rect x="0" y="36" width="130" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="65" y="54" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">SAC Agent #2</text>

      <rect x="0" y="72" width="130" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="65" y="90" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">SAC Agent #3</text>

      <rect x="0" y="108" width="130" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="65" y="126" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">SAC Agent #4</text>

      <rect x="0" y="144" width="130" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="65" y="162" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">SAC Agent #5</text>
    </g>

    <!-- Connector to Median Aggregator -->
    <path d="M 140 100 L 175 100" stroke="#38bdf8" stroke-width="2"/>
    <rect x="180" y="60" width="110" height="80" rx="8" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="235" y="95" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Median Action</text>
    <text x="235" y="115" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Aggregation</text>
  </g>

  <!-- Right Side: Lagrangian Safety Constraints & CDR Evaluation -->
  <g transform="translate(420, 115)">
    <text x="0" y="0" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Lagrangian Safety Boundaries</text>
    <text x="0" y="18" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Mean Arterial Pressure (MAP) Constraint: [65-90 mmHg]</text>

    <rect x="0" y="35" width="280" height="170" rx="10" fill="#080d1a" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <!-- Safe zone corridor -->
    <rect x="20" y="70" width="240" height="70" rx="4" fill="#065f46" fill-opacity="0.3" stroke="#059669" stroke-width="1" stroke-dasharray="3"/>
    <text x="245" y="85" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">Safe Zone (MAP &gt; 65)</text>

    <!-- Dangerous trajectory vs Constrained trajectory -->
    <path d="M 30 155 Q 70 170, 120 160 T 250 145" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="3" opacity="0.6"/>
    <text x="35" y="175" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="8">Unconstrained Policy</text>

    <!-- Constrained RL trajectory -->
    <path d="M 30 145 C 60 130, 90 95, 140 100 S 200 110, 250 95" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glowEffect2)"/>
    <circle cx="250" cy="95" r="5" fill="#38bdf8"/>
    <text x="250" y="130" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="end">Lagrangian Safe Policy</text>

    <text x="20" y="190" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Calibrated Doubly Robust ESS = 1374</text>
  </g>
</svg>
