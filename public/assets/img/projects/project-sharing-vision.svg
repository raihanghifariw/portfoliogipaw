<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101a"/>
      <stop offset="50%" stop-color="#0e1b2e"/>
      <stop offset="100%" stop-color="#050a12"/>
    </linearGradient>
    <filter id="glowEffect6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad6)"/>
  
  <g opacity="0.12">
    <path d="M 0 50 L 800 50 M 0 100 L 800 100 M 0 150 L 800 150 M 0 200 L 800 200 M 0 250 L 800 250 M 0 300 L 800 300 M 0 350 L 800 350 M 0 400 L 800 400" stroke="#0284c7" stroke-width="1"/>
    <path d="M 50 0 L 50 450 M 100 0 L 100 450 M 150 0 L 150 450 M 200 0 L 200 450 M 250 0 L 250 450 M 300 0 L 300 450 M 350 0 L 350 450 M 400 0 L 400 450 M 450 0 L 450 450 M 500 0 L 500 450 M 550 0 L 550 450 M 600 0 L 600 450 M 650 0 L 650 450 M 700 0 L 700 450 M 750 0 L 750 450" stroke="#0284c7" stroke-width="1"/>
  </g>

  <circle cx="200" cy="200" r="140" fill="#0284c7" opacity="0.2" filter="url(#glowEffect6)"/>
  <circle cx="620" cy="240" r="140" fill="#3b82f6" opacity="0.16" filter="url(#glowEffect6)"/>

  <rect x="60" y="45" width="680" height="360" rx="16" fill="#0c1626" fill-opacity="0.85" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <rect x="60" y="45" width="680" height="42" rx="16" fill="#13233c" fill-opacity="0.9"/>
  <circle cx="90" cy="66" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="106" cy="66" r="5" fill="#eab308" opacity="0.8"/>
  <circle cx="122" cy="66" r="5" fill="#22c55e" opacity="0.8"/>
  <text x="150" y="71" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">SHARING-VISION // FULLSTACK-GO // REST-API</text>

  <rect x="570" y="56" width="150" height="20" rx="10" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
  <text x="645" y="70" fill="#bae6fd" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">LIVE VERCEL DEPLOYED</text>

  <!-- Left: Go REST Backend Microservices -->
  <g transform="translate(90, 115)">
    <text x="0" y="0" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Go (Golang) REST Service</text>
    <text x="0" y="18" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Concurrent Gin Router &amp; PostgreSQL GORM</text>

    <g transform="translate(0, 35)">
      <rect x="0" y="0" width="270" height="35" rx="6" fill="#082f49" stroke="#0ea5e9" stroke-width="1.2"/>
      <text x="15" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">GET /api/v1/articles</text>
      <text x="255" y="22" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">200 OK (2ms)</text>

      <rect x="0" y="45" width="270" height="35" rx="6" fill="#082f49" stroke="#0ea5e9" stroke-width="1.2"/>
      <text x="15" y="67" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">POST /api/v1/articles</text>
      <text x="255" y="67" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">201 CREATED</text>

      <rect x="0" y="90" width="270" height="35" rx="6" fill="#082f49" stroke="#0ea5e9" stroke-width="1.2"/>
      <text x="15" y="112" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">DELETE /api/v1/trash/:id</text>
      <text x="255" y="112" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">204 NO CONTENT</text>
    </g>
  </g>

  <!-- Right: TypeScript React Frontend Dashboard -->
  <g transform="translate(390, 115)">
    <text x="0" y="0" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">TypeScript Frontend Dashboard</text>
    <text x="0" y="18" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Tabbed Data Table, Filter, Pagination, Modals</text>

    <rect x="0" y="35" width="320" height="175" rx="8" fill="#07111e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Tabs inside dashboard -->
    <g transform="translate(15, 55)">
      <rect x="0" y="0" width="80" height="24" rx="4" fill="#0284c7"/>
      <text x="40" y="16" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Published (18)</text>

      <rect x="90" y="0" width="65" height="24" rx="4" fill="#1e293b"/>
      <text x="122" y="16" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="10" text-anchor="middle">Drafts (4)</text>

      <rect x="165" y="0" width="65" height="24" rx="4" fill="#1e293b"/>
      <text x="197" y="16" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="10" text-anchor="middle">Trashed (2)</text>
    </g>

    <!-- Table preview rows -->
    <g transform="translate(15, 95)" font-family="'JetBrains Mono', monospace" font-size="10">
      <line x1="0" y1="0" x2="290" y2="0" stroke="rgba(255,255,255,0.1)"/>
      <text x="5" y="20" fill="#e2e8f0">1. AI Infrastructure Benchmark</text>
      <text x="285" y="20" fill="#38bdf8" text-anchor="end">Edit | Delete</text>

      <line x1="0" y1="32" x2="290" y2="32" stroke="rgba(255,255,255,0.06)"/>
      <text x="5" y="52" fill="#e2e8f0">2. Deep RL in Sepsis Clinical Care</text>
      <text x="285" y="52" fill="#38bdf8" text-anchor="end">Edit | Delete</text>

      <line x1="0" y1="64" x2="290" y2="64" stroke="rgba(255,255,255,0.06)"/>
      <text x="5" y="84" fill="#e2e8f0">3. VLM Defect Detection On-Prem</text>
      <text x="285" y="84" fill="#38bdf8" text-anchor="end">Edit | Delete</text>
    </g>
  </g>
</svg>
