<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#121026"/>
      <stop offset="100%" stop-color="#07070d"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad1)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.15">
    <path d="M 0 50 L 800 50 M 0 100 L 800 100 M 0 150 L 800 150 M 0 200 L 800 200 M 0 250 L 800 250 M 0 300 L 800 300 M 0 350 L 800 350 M 0 400 L 800 400" stroke="#8b5cf6" stroke-width="1"/>
    <path d="M 50 0 L 50 450 M 100 0 L 100 450 M 150 0 L 150 450 M 200 0 L 200 450 M 250 0 L 250 450 M 300 0 L 300 450 M 350 0 L 350 450 M 400 0 L 400 450 M 450 0 L 450 450 M 500 0 L 500 450 M 550 0 L 550 450 M 600 0 L 600 450 M 650 0 L 650 450 M 700 0 L 700 450 M 750 0 L 750 450" stroke="#8b5cf6" stroke-width="1"/>
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="180" r="140" fill="#8b5cf6" opacity="0.18" filter="url(#glowEffect)"/>
  <circle cx="620" cy="240" r="160" fill="#0284c7" opacity="0.15" filter="url(#glowEffect)"/>

  <!-- Architecture UI Card Container -->
  <rect x="60" y="45" width="680" height="360" rx="16" fill="#12121e" fill-opacity="0.85" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Top Terminal Bar -->
  <rect x="60" y="45" width="680" height="42" rx="16" fill="#181829" fill-opacity="0.9"/>
  <circle cx="90" cy="66" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="106" cy="66" r="5" fill="#eab308" opacity="0.8"/>
  <circle cx="122" cy="66" r="5" fill="#22c55e" opacity="0.8"/>
  <text x="150" y="71" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">PRAGMA-HACKATHON // DECISION-TRANSFORMER-PIPELINE</text>

  <!-- Status Badge -->
  <rect x="600" y="56" width="120" height="20" rx="10" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
  <text x="660" y="70" fill="#c084fc" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">TEAMWORK WINNER</text>

  <!-- Left Side: Attention Heads / Transformer Model Graph -->
  <g transform="translate(100, 120)">
    <text x="0" y="0" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Multi-Head Self Attention</text>
    <text x="0" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Sequence: [State, Action, Return-to-go]</text>

    <!-- Neural blocks -->
    <rect x="0" y="40" width="80" height="34" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="40" y="62" fill="#c7d2fe" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">S(t-1)</text>

    <rect x="95" y="40" width="80" height="34" rx="6" fill="#311042" stroke="#c084fc" stroke-width="1.5"/>
    <text x="135" y="62" fill="#f5d0fe" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">A(t-1)</text>

    <rect x="190" y="40" width="80" height="34" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="230" y="62" fill="#bae6fd" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">R(t)</text>

    <!-- Transformer Encoder Block -->
    <rect x="0" y="95" width="270" height="50" rx="8" fill="#1e1b4b" fill-opacity="0.9" stroke="url(#purpleGlow)" stroke-width="1.5"/>
    <text x="135" y="125" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Causal Transformer Block (8 Heads)</text>

    <!-- Dosage Output Prediction -->
    <rect x="0" y="165" width="270" height="42" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="135" y="191" fill="#5eead4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">→ Continuous Vasopressor Dosage</text>
  </g>

  <!-- Right Side: Clinical ICU Time-Series Curve -->
  <g transform="translate(420, 120)">
    <text x="0" y="0" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">ICU Physiological Trajectory</text>
    <text x="0" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Mean Arterial Pressure (MAP) vs Reward</text>

    <!-- Graph Frame -->
    <rect x="0" y="40" width="270" height="165" rx="8" fill="#0b0f19" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Grid lines inside graph -->
    <line x1="20" y1="80" x2="250" y2="80" stroke="rgba(255,255,255,0.06)" stroke-dasharray="4"/>
    <line x1="20" y1="120" x2="250" y2="120" stroke="rgba(255,255,255,0.06)" stroke-dasharray="4"/>
    <line x1="20" y1="160" x2="250" y2="160" stroke="rgba(255,255,255,0.06)" stroke-dasharray="4"/>

    <!-- Clinician Baseline Line (Dotted Red) -->
    <path d="M 25 150 Q 80 145, 140 140 T 245 130" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4" opacity="0.8"/>
    <text x="245" y="125" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">Clinician (73.5%)</text>

    <!-- Transformer Optimal Policy Line (Glowing Cyan/Purple) -->
    <path d="M 25 160 C 70 140, 110 85, 160 80 S 210 65, 245 60" fill="none" stroke="url(#lineGlow)" stroke-width="3.5" filter="url(#glowEffect)"/>
    <path d="M 25 160 C 70 140, 110 85, 160 80 S 210 65, 245 60" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="245" cy="60" r="5" fill="#38bdf8" filter="url(#glowEffect)"/>
    <text x="245" y="52" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="end">OPE Policy: +14% Return</text>
  </g>
</svg>
