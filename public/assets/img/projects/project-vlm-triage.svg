<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="50%" stop-color="#181329"/>
      <stop offset="100%" stop-color="#08070e"/>
    </linearGradient>
    <filter id="glowEffect3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad3)"/>
  
  <g opacity="0.12">
    <path d="M 0 50 L 800 50 M 0 100 L 800 100 M 0 150 L 800 150 M 0 200 L 800 200 M 0 250 L 800 250 M 0 300 L 800 300 M 0 350 L 800 350 M 0 400 L 800 400" stroke="#a855f7" stroke-width="1"/>
    <path d="M 50 0 L 50 450 M 100 0 L 100 450 M 150 0 L 150 450 M 200 0 L 200 450 M 250 0 L 250 450 M 300 0 L 300 450 M 350 0 L 350 450 M 400 0 L 400 450 M 450 0 L 450 450 M 500 0 L 500 450 M 550 0 L 550 450 M 600 0 L 600 450 M 650 0 L 650 450 M 700 0 L 700 450 M 750 0 L 750 450" stroke="#a855f7" stroke-width="1"/>
  </g>

  <circle cx="220" cy="220" r="140" fill="#a855f7" opacity="0.18" filter="url(#glowEffect3)"/>
  <circle cx="600" cy="200" r="140" fill="#ec4899" opacity="0.15" filter="url(#glowEffect3)"/>

  <rect x="60" y="45" width="680" height="360" rx="16" fill="#151224" fill-opacity="0.85" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <rect x="60" y="45" width="680" height="42" rx="16" fill="#201b38" fill-opacity="0.9"/>
  <circle cx="90" cy="66" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="106" cy="66" r="5" fill="#eab308" opacity="0.8"/>
  <circle cx="122" cy="66" r="5" fill="#22c55e" opacity="0.8"/>
  <text x="150" y="71" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">VISION-LANGUAGE // DEFECT-TRIAGE // EDGE INFERENCE</text>

  <rect x="580" y="56" width="140" height="20" rx="10" fill="#9333ea" fill-opacity="0.25" stroke="#c084fc" stroke-width="1"/>
  <text x="650" y="70" fill="#e9d5ff" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">ON-PREM EDGE VLM</text>

  <!-- Left: Industrial Circuit / Feed with Bounding Boxes -->
  <g transform="translate(90, 115)">
    <text x="0" y="0" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Live Optical Inspection Feed</text>
    <text x="0" y="18" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Automated Anomaly Heatmap</text>

    <!-- Circuit board mockup -->
    <rect x="0" y="35" width="270" height="175" rx="8" fill="#0c1815" stroke="#059669" stroke-width="1.5"/>
    <!-- PCB traces -->
    <path d="M 20 60 L 80 60 L 100 85 L 180 85 L 200 120 L 250 120" stroke="#10b981" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 30 160 L 90 160 L 110 135 L 170 135 L 190 170 L 240 170" stroke="#10b981" stroke-width="2" fill="none" opacity="0.5"/>
    <circle cx="100" cy="85" r="4" fill="#34d399"/>
    <circle cx="180" cy="85" r="4" fill="#34d399"/>

    <!-- Defect Bounding Box (Red/Amber) -->
    <rect x="130" y="65" width="75" height="55" rx="4" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" stroke-width="2" stroke-dasharray="3"/>
    <rect x="130" y="47" width="75" height="18" fill="#ef4444" rx="2"/>
    <text x="167" y="60" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">SCRATCH 98%</text>

    <!-- Defect 2 (Yellow) -->
    <rect x="35" y="125" width="60" height="50" rx="4" fill="#eab308" fill-opacity="0.2" stroke="#eab308" stroke-width="1.5"/>
    <rect x="35" y="110" width="60" height="15" fill="#eab308" rx="2"/>
    <text x="65" y="121" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">SOLDER GAP</text>
  </g>

  <!-- Right: VLM Zero-Shot Explanation Stream -->
  <g transform="translate(400, 115)">
    <text x="0" y="0" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">LLaVA Zero-Shot Multimodal Triage</text>
    <text x="0" y="18" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">JSON Output Validation (Pydantic / Ollama)</text>

    <rect x="0" y="35" width="310" height="175" rx="8" fill="#0b0a14" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <g transform="translate(15, 55)" font-family="'JetBrains Mono', monospace" font-size="10">
      <text x="0" y="0" fill="#c084fc">{\n</text>
      <text x="15" y="18" fill="#94a3b8">"defect_class": <tspan fill="#38bdf8">"surface_micro_scratch"</tspan>,</text>
      <text x="15" y="36" fill="#94a3b8">"severity_level": <tspan fill="#ef4444">"CRITICAL"</tspan>,</text>
      <text x="15" y="54" fill="#94a3b8">"bounding_box": <tspan fill="#f59e0b">[130, 65, 205, 120]</tspan>,</text>
      <text x="15" y="72" fill="#94a3b8">"root_cause_explanation":</text>
      <text x="25" y="90" fill="#e2e8f0">"Mechanical shear along trace #4;</text>
      <text x="25" y="106" fill="#e2e8f0"> recommended automated reject."</text>
      <text x="15" y="126" fill="#94a3b8">"inference_latency": <tspan fill="#10b981">"42ms (Quantized)"</tspan></text>
      <text x="0" y="142" fill="#c084fc">}</text>
    </g>
  </g>
</svg>
